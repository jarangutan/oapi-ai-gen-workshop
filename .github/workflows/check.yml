name: Check Go and generated code

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate
        run: go generate ./...
      - name: Tidy
        run: go mod tidy
      - name: Build
        run: go build ./...
      - name: Check generated files
        run: git diff --exit-code
